<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-labelledby="title desc">
  <title id="title">What happens when a URL component is encoded twice?</title>
  <desc id="desc">A space becomes percent 20 after one pass. On a second pass the percent sign itself is encoded as percent 25.</desc>
  <rect width="880" height="240" rx="16" fill="#172523"/>
  <g font-family="system-ui,sans-serif">
    <text x="34" y="43" font-size="18" fill="#a6cbb5">Identity engineering</text>
    <text x="34" y="90" font-size="32" font-weight="650" fill="#f5f5ea">One space, two encoding passes</text>
    <path d="M35 119h808" stroke="#45645a"/>
    <g font-size="17" fill="#bbcabd">
      <text x="35" y="157">Input</text><text x="305" y="157">Encoded once</text><text x="583" y="157">Encoded twice</text>
    </g>
    <g font-family="ui-monospace,monospace" font-size="26" fill="#fff9e7">
      <text x="35" y="201">sign in</text><text x="305" y="201">sign<tspan fill="#a9e5b8">%20</tspan>in</text><text x="583" y="201">sign<tspan fill="#f3bd88">%25</tspan>20in</text>
    </g>
    <path d="M220 190h31m-8-7 8 7-8 7m232-7h31m-8-7 8 7-8 7" fill="none" stroke="#83aa95" stroke-width="2"/>
  </g>
</svg>
